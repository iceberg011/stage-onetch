<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | OneTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            color-scheme: dark;
            --bg: #05070b;
            --bg-accent: #0b1322;
            --card: rgba(10, 15, 24, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f5f7fb;
            --muted: #9fb0c7;
            --brand: #2f79ff;
            --brand-warm: #ff9f2d;
            --shadow: 0 32px 90px rgba(0, 0, 0, 0.45);
            --ring: 0 0 0 4px rgba(47, 121, 255, 0.22);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 0% 0%, rgba(47, 121, 255, 0.18), transparent 35%),
                radial-gradient(circle at 100% 20%, rgba(255, 159, 45, 0.18), transparent 30%),
                linear-gradient(145deg, var(--bg), var(--bg-accent));
            padding: 36px;
        }

        .shell {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            gap: 22px;
        }

        .topbar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        .logo {
            width: 170px;
            height: auto;
            display: block;
            filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.35));
        }

        .welcome {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 30px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(2rem, 3.8vw, 3rem);
            letter-spacing: -0.03em;
        }

        .welcome p {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .user-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
        }

        .info-card .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text);
        }

        .badge {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid rgba(47, 121, 255, 0.35);
            background: rgba(47, 121, 255, 0.12);
            color: #dbeafe;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .link {
            color: #e8eefb;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 159, 45, 0.35);
            background: rgba(255, 159, 45, 0.14);
            transition: all 0.3s ease;
        }

        .link:hover {
            background: rgba(255, 159, 45, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 159, 45, 0.2);
        }

        .link-logout {
            border-color: rgba(220, 38, 38, 0.35);
            background: rgba(220, 38, 38, 0.14);
        }

        .link-logout:hover {
            background: rgba(220, 38, 38, 0.25);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.2);
        }

        .link-dashboard {
            border-color: rgba(47, 121, 255, 0.35);
            background: rgba(47, 121, 255, 0.14);
        }

        .link-dashboard:hover {
            background: rgba(47, 121, 255, 0.25);
            box-shadow: 0 8px 20px rgba(47, 121, 255, 0.2);
        }

        @media (max-width: 700px) {
            body { padding: 18px; }
            .topbar { 
                gap: 12px; 
                align-items: flex-start; 
                flex-direction: column;
            }
            .actions {
                width: 100%;
                justify-content: flex-start;
            }
            .user-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <!-- Top Bar -->
        <header class="topbar">
            <img th:src="@{/image/logo.png}" alt="OneTech logo" class="logo" />
            <div class="actions">
                <a th:href="@{/dashboard}" class="link link-dashboard">Dashboard</a>
                <a th:href="@{/logout}" class="link link-logout">Sign out</a>
            </div>
        </header>

        <!-- Welcome Section -->
        <section class="welcome">
            <h1>Welcome back, <span th:text="${session.user.first_name}"></span>!</h1>
            <p>Here's your account overview. You're signed in and ready to go.</p>
            <div class="badge">✓ Active session</div>

            <!-- User Information Cards -->
            <div class="user-info">
                <div class="info-card">
                    <div class="label">Full Name</div>
                    <div class="value">
                        <span th:text="${session.user.first_name}"></span> 
                        <span th:text="${session.user.last_name}"></span>
                    </div>
                </div>
                <div class="info-card">
                    <div class="label">Username</div>
                    <div class="value" th:text="${session.user.username}"></div>
                </div>
                <div class="info-card">
                    <div class="label">Email</div>
                    <div class="value" th:text="${session.user.email}"></div>
                </div>
                <div class="info-card">
                    <div class="label">Phone</div>
                    <div class="value" th:text="${session.user.phone_number}"></div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
