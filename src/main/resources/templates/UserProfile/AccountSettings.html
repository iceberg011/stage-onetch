<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Page Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h2 style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.8rem; margin-bottom: 4px; color: #1a1a2e;">My Profile</h2>
                <p style="color: #6c757d;">View and manage your account information</p>
            </div>
            <a href="/dashboard" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 10px; color: #6c757d; text-decoration: none; font-weight: 500; font-size: 0.9rem; border: 1px solid #e9ecef; background: #ffffff;">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Back to Dashboard
            </a>
        </div>

        <!-- Profile Card -->
        <div style="background: #ffffff; border: 1px solid #e9ecef; border-radius: 16px; overflow: hidden;">
            <div style="display: flex; padding: 32px; gap: 32px; flex-wrap: wrap;">
                <!-- Left: Avatar -->
                <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; flex: 0 0 auto;">
                    <div style="width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #2f79ff, #ff9f2d); display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 700; color: white; box-shadow: 0 4px 20px rgba(47, 121, 255, 0.3);" 
                         th:text="${firstName != null ? firstName.substring(0, 1) + (lastName != null ? lastName.substring(0, 1) : '') : 'U'}"></div>
                    <span style="display: inline-block; padding: 4px 16px; border-radius: 999px; background: rgba(34, 197, 94, 0.12); color: #22c55e; font-size: 0.8rem; font-weight: 600;" 
                          th:text="${isActive} ? '🟢 Active' : '🔴 Inactive'"></span>
                    <span style="display: inline-block; padding: 4px 16px; border-radius: 999px; background: rgba(47, 121, 255, 0.12); color: #2f79ff; font-size: 0.8rem; font-weight: 600;" 
                          th:text="${isSuperuser} ? '🛡️ Administrator' : '👤 User'"></span>
                </div>

                <!-- Right: User Details -->
                <div style="flex: 1; min-width: 280px;">
                    <h3 style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.8rem; color: #1a1a2e; margin-bottom: 4px;" th:text="${firstName + ' ' + lastName}"></h3>
                    <p style="color: #6c757d; margin-bottom: 24px;">@<span th:text="${username}"></span></p>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div style="background: #f8f9fa; border-radius: 12px; padding: 14px 16px;">
                            <div style="color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Email</div>
                            <div style="font-weight: 500; color: #1a1a2e; margin-top: 4px;" th:text="${email}"></div>
                        </div>
                        <div style="background: #f8f9fa; border-radius: 12px; padding: 14px 16px;">
                            <div style="color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Phone</div>
                            <div style="font-weight: 500; color: #1a1a2e; margin-top: 4px;" th:text="${phoneNumber != null ? phoneNumber : 'Not provided'}"></div>
                        </div>
                        <div style="background: #f8f9fa; border-radius: 12px; padding: 14px 16px;">
                            <div style="color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">User ID</div>
                            <div style="font-weight: 500; color: #1a1a2e; margin-top: 4px;" th:text="${userId}"></div>
                        </div>
                        <div style="background: #f8f9fa; border-radius: 12px; padding: 14px 16px;">
                            <div style="color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Login Count</div>
                            <div style="font-weight: 500; color: #1a1a2e; margin-top: 4px;" th:text="${loginCount}"></div>
                        </div>
                        <div style="background: #f8f9fa; border-radius: 12px; padding: 14px 16px; grid-column: 1 / -1;">
                            <div style="color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Member Since</div>
                            <div style="font-weight: 500; color: #1a1a2e; margin-top: 4px;" th:text="${dateJoin}"></div>
                        </div>
                        <div style="background: #f8f9fa; border-radius: 12px; padding: 14px 16px; grid-column: 1 / -1;">
                            <div style="color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Last Login</div>
                            <div style="font-weight: 500; color: #1a1a2e; margin-top: 4px;" th:text="${lastLogin != null ? lastLogin : 'First login'}"></div>
                        </div>
                        <!-- Departments -->
                        <div style="background: #f8f9fa; border-radius: 12px; padding: 14px 16px; grid-column: 1 / -1;">
                            <div style="color: #6c757d; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;">Departments</div>
                            <div style="margin-top: 4px;">
                                <div th:if="${userDepartments != null and not userDepartments.isEmpty()}">
                                    <span th:each="dept : ${userDepartments}" 
                                        style="display: inline-block; padding: 4px 14px; margin: 2px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: rgba(47, 121, 255, 0.12); color: #2f79ff;">
                                        <span th:text="${dept.dept_name}"></span>
                                    </span>
                                </div>
                                <span th:if="${userDepartments == null or userDepartments.isEmpty()}" 
                                    style="color: #6c757d; font-size: 0.9rem;">No departments assigned</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div style="margin-top: 24px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 16px; padding: 24px;">
            <h3 style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.1rem; color: #1a1a2e; margin-bottom: 16px;">Account Actions</h3>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <a href="#" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: linear-gradient(135deg, #2f79ff, #1a5fd8); color: white; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(47, 121, 255, 0.2);">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                    Edit Profile
                </a>
                <a href="/logout" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: #ffffff; color: #ef4444; border: 1px solid #fecaca; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Sign Out
                </a>
            </div>
        </div>
    </div>
</body>
</html>
