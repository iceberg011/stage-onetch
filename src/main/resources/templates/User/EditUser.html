<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit User</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Page Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h2 style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.8rem; margin-bottom: 4px; color: #1a1a2e;">Edit User</h2>
                <p style="color: #6c757d;">Update user information and account settings</p>
            </div>
            <a href="/dashboard/Users" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 10px; color: #6c757d; text-decoration: none; font-weight: 500; font-size: 0.9rem; border: 1px solid #e9ecef; background: #ffffff;">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Back to List
            </a>
        </div>

        <!-- Error Alert -->
        <div th:if="${error}" style="padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 500; background: #fee2e2; color: #dc2626; border: 1px solid #fecaca;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${error}"></span>
        </div>

        <!-- Success Alert -->
        <div th:if="${success}" style="padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 500; background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${success}"></span>
        </div>

        <!-- Edit Form -->
        <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 16px; padding: 32px;">
            <form th:action="@{'/dashboard/users/update/' + ${user.id}}" method="post">
                <!-- Hidden field for user ID -->
                <input type="hidden" name="id" th:value="${user.id}" />

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <!-- First Name -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">First Name <span style="color: #ef4444;">*</span></label>
                        <input type="text" name="first_name" th:value="${user.first_name}" placeholder="Enter first name" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif; transition: border-color 0.2s ease, box-shadow 0.2s ease;">
                    </div>

                    <!-- Last Name -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Last Name <span style="color: #ef4444;">*</span></label>
                        <input type="text" name="last_name" th:value="${user.last_name}" placeholder="Enter last name" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                    </div>

                    <!-- Email -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Email <span style="color: #ef4444;">*</span></label>
                        <input type="email" name="email" th:value="${user.email}" placeholder="example@email.com" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                    </div>

                    <!-- Phone -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Phone</label>
                        <input type="text" name="tele_phone" th:value="${user.gettele_phone()}" placeholder="Phone number" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                        <span style="font-size: 0.7rem; color: #6c757d;">Format: 1234567890</span>
                    </div>

                    <!-- Username -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Username <span style="color: #ef4444;">*</span></label>
                        <input type="text" name="username" th:value="${user.username}" placeholder="Enter username" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                    </div>

                    <!-- Password (Optional) -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">New Password</label>
                        <input type="password" name="password" placeholder="Leave empty to keep current password" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                        <span style="font-size: 0.7rem; color: #6c757d;">Leave empty to keep current password</span>
                    </div>

                    <!-- Confirm Password -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Confirm New Password</label>
                        <input type="password" name="confirm_password" placeholder="Confirm new password" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                    </div>

                    <!-- Role -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Role</label>
                        <select name="role" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                            <option value="user" th:selected="${!user.is_superuser}">User</option>
                            <option value="admin" th:selected="${user.is_superuser}">Administrator</option>
                            <option value="staff" th:selected="${user.is_staff}">Staff</option>
                        </select>
                    </div>

                    <!-- Status -->
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Status</label>
                        <select name="is_active" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                            <option value="true" th:selected="${user.is_active}">Active</option>
                            <option value="false" th:selected="${!user.is_active}">Inactive</option>
                        </select>
                    </div>

                    <!-- Advanced Options -->
                    <div style="grid-column: 1 / -1; margin-top: 8px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 0;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <input type="checkbox" name="is_staff" id="is_staff" th:checked="${user.is_staff}" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="is_staff" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Staff</label>
                                <span style="font-size: 0.7rem; color: #6c757d;">(Limited admin access)</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <input type="checkbox" name="is_superuser" id="is_superuser" th:checked="${user.is_superuser}" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="is_superuser" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Superuser</label>
                                <span style="font-size: 0.7rem; color: #6c757d;">(All permissions)</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <input type="checkbox" name="is_public" id="is_public" th:checked="${user.is_public}" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="is_public" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Public</label>
                                <span style="font-size: 0.7rem; color: #6c757d;">(Visible profile)</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <input type="checkbox" name="can_manage_all_dept" id="can_manage_all_dept" th:checked="${user.can_manage_all_dept}" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="can_manage_all_dept" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Manage All Departments</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div style="display: flex; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid #e9ecef; justify-content: flex-end;">
                    <a href="/dashboard/Users" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; text-decoration: none; background: #f1f3f5; color: #1a1a2e; border: 1px solid #e9ecef;">Cancel</a>
                    <button type="submit" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; background: linear-gradient(135deg, #2f79ff, #ff9f2d); color: white; box-shadow: 0 4px 15px rgba(47, 121, 255, 0.3); font-family: 'Inter', Arial, sans-serif;">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Update User
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
