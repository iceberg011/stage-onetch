<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add User</title>
</head>
<body>
    <div th:fragment="content">
        <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 20px; padding: 32px; max-width: 900px; margin: 0 auto;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid #e9ecef;">
                <h2 style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.4rem; color: #1a1a2e; display: flex; align-items: center; gap: 12px;">
                    <svg width="28" height="28" fill="none" stroke="#2f79ff" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    Add New User
                </h2>
                <a href="/dashboard/Users" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 10px; color: #6c757d; text-decoration: none; font-weight: 500; font-size: 0.9rem; border: 1px solid #e9ecef; background: #ffffff;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Back to List
                </a>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" style="padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 500; background: #fee2e2; color: #dc2626; border: 1px solid #fecaca;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span th:text="${error}"></span>
            </div>

            <!-- Success Alert -->
            <div th:if="${success}" style="padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 500; background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span th:text="${success}"></span>
            </div>

            <!-- Form -->
            <form th:action="@{/dashboard/users/CreateUser}" method="post">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">First Name <span style="color: #ef4444;">*</span></label>
                        <input type="text" name="first_name" placeholder="Enter first name" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;" />
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Last Name <span style="color: #ef4444;">*</span></label>
                        <input type="text" name="last_name" placeholder="Enter last name" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;" />
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Email <span style="color: #ef4444;">*</span></label>
                        <input type="email" name="email" placeholder="example@email.com" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;" />
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Phone</label>
                        <input type="text" name="tele_phone" placeholder="Phone number" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;" />
                        <span style="font-size: 0.75rem; color: #6c757d;">Format: 1234567890</span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Username</label>
                        <input type="text" name="username" placeholder="Leave empty for auto-generation" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;" />
                        <span style="font-size: 0.75rem; color: #6c757d;">Auto-generated if left empty</span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Password <span style="color: #ef4444;">*</span></label>
                        <input type="password" name="password" placeholder="Enter password" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;" />
                        <span style="font-size: 0.75rem; color: #6c757d;">Minimum 8 characters</span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Confirm Password <span style="color: #ef4444;">*</span></label>
                        <input type="password" name="confirm_password" placeholder="Confirm password" required style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;" />
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Role</label>
                        <select name="role" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                            <option value="user">User</option>
                            <option value="admin">Administrator</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Status</label>
                        <select name="is_active" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                    <div style="grid-column: 1 / -1; margin-top: 8px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 0;">
                            <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
                                <input type="checkbox" name="is_staff" id="is_staff" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="is_staff" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Staff</label>
                                <span style="font-size: 0.75rem; color: #6c757d; margin-left: 4px;">(Limited admin access)</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
                                <input type="checkbox" name="is_superuser" id="is_superuser" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="is_superuser" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Superuser</label>
                                <span style="font-size: 0.75rem; color: #6c757d; margin-left: 4px;">(All permissions)</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
                                <input type="checkbox" name="is_public" id="is_public" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="is_public" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Public</label>
                                <span style="font-size: 0.75rem; color: #6c757d; margin-left: 4px;">(Visible profile)</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
                                <input type="checkbox" name="can_manage_all_dept" id="can_manage_all_dept" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                                <label for="can_manage_all_dept" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Manage All Departments</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid #e9ecef; justify-content: flex-end;">
                    <a href="/dashboard/Users" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; text-decoration: none; background: #f1f3f5; color: #1a1a2e; border: 1px solid #e9ecef;">Cancel</a>
                    <button type="submit" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; background: linear-gradient(135deg, #2f79ff, #ff9f2d); color: white; box-shadow: 0 4px 15px rgba(47, 121, 255, 0.3); font-family: 'Inter', Arial, sans-serif;">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                        Create User
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
