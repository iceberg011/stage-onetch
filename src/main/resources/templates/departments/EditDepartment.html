<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Department</title>
</head>
<body>
    <div th:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h2 style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.8rem; margin-bottom: 4px; color: #1a1a2e;">Edit Department</h2>
                <p style="color: #6c757d;">Update the department details</p>
            </div>
            <a href="/dashboard/departments" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 10px; color: #6c757d; text-decoration: none; font-weight: 500; font-size: 0.9rem; border: 1px solid #e9ecef; background: #ffffff;">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Back to List
            </a>
        </div>

        <div th:if="${error}" style="padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 500; background: #fee2e2; color: #dc2626; border: 1px solid #fecaca;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${error}"></span>
        </div>

        <div th:if="${success}" style="padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 500; background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0;">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${success}"></span>
        </div>

        <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 16px; padding: 32px; max-width: 600px;">
            <form th:action="@{'/dashboard/departments/update/' + ${department.id}}" method="post">
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Department Code</label>
                        <div style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #e9ecef; color: #6c757d; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif;"
                             th:text="${department.getdept_code()}">DEP001</div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label for="dept_name" style="font-weight: 600; font-size: 0.85rem; color: #1a1a2e;">Department Name <span style="color: #ef4444;">*</span></label>
                        <input type="text" id="dept_name" name="dept_name" th:value="${department.getdept_name()}" placeholder="Enter department name" required
                               style="padding: 10px 14px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; font-family: 'Inter', Arial, sans-serif; transition: border-color 0.2s ease, box-shadow 0.2s ease;">
                    </div>

                    <div style="display: flex; align-items: center; gap: 12px;">
                        <input type="checkbox" name="is_default" id="is_default" th:checked="${department.getIs_default()}" style="width: 18px; height: 18px; cursor: pointer; accent-color: #2f79ff;" />
                        <label for="is_default" style="font-weight: 500; font-size: 0.9rem; color: #1a1a2e; cursor: pointer;">Set as Default Department</label>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid #e9ecef; justify-content: flex-end;">
                    <a href="/dashboard/departments" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; text-decoration: none; background: #f1f3f5; color: #1a1a2e; border: 1px solid #e9ecef;">Cancel</a>
                    <button type="submit" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; background: linear-gradient(135deg, #2f79ff, #ff9f2d); color: white; box-shadow: 0 4px 15px rgba(47, 121, 255, 0.3); font-family: 'Inter', Arial, sans-serif;">
                        Update Department
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
