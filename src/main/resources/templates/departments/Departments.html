<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Departments</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Page Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h2 style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.8rem; margin-bottom: 4px; color: #1a1a2e;">Departments List</h2>
                <p style="color: #6c757d;">Manage all departments in the system</p>
            </div>
            <a href="/dashboard/departments/CreateDepartment" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 12px; font-weight: 600; text-decoration: none; background: linear-gradient(135deg, #2f79ff, #ff9f2d); color: white; box-shadow: 0 4px 15px rgba(47, 121, 255, 0.3);">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                Add Department
            </a>
        </div>

        <!-- Stats Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px;">
            <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <div style="color: #6c757d; font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Total Departments</div>
                    <div style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 1.8rem; font-weight: 700; margin-top: 2px; color: #1a1a2e;" th:text="${departmentCount}">0</div>
                </div>
                <div style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(47, 121, 255, 0.12); color: #2f79ff;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 16px; padding: 16px 20px; margin-bottom: 24px;">
            <form method="get" action="/dashboard/departments" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
                <div style="flex: 1; min-width: 200px; position: relative;">
                    <input type="text" name="search" placeholder="🔍 Search departments..." 
                           th:value="${searchQuery}" 
                           style="width: 100%; padding: 10px 16px; border-radius: 10px; border: 1px solid #e9ecef; background: #ffffff; color: #1a1a2e; font-size: 0.9rem; outline: none;">
                </div>
                <button type="submit" style="padding: 10px 24px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; background: linear-gradient(135deg, #2f79ff, #1a5fd8); color: white;">
                    Search
                </button>
                <a href="/dashboard/departments" style="padding: 10px 24px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; text-decoration: none; background: #f1f3f5; color: #1a1a2e; border: 1px solid #e9ecef;">
                    Clear
                </a>
            </form>
        </div>

        <!-- Departments Table -->
        <div style="background: #ffffff; border: 1px solid #e9ecef; border-radius: 16px; overflow: auto;">
            <table style="width: 100%; border-collapse: collapse; min-width: 700px;">
                <thead style="background: #f8f9fa;">
                    <tr>
                        <th style="padding: 12px 16px; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; font-weight: 600; border-bottom: 1px solid #e9ecef;">#</th>
                        <th style="padding: 12px 16px; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; font-weight: 600; border-bottom: 1px solid #e9ecef;">Department Code</th>
                        <th style="padding: 12px 16px; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; font-weight: 600; border-bottom: 1px solid #e9ecef;">Department Name</th>
                        <th style="padding: 12px 16px; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; font-weight: 600; border-bottom: 1px solid #e9ecef;">Default</th>
                        <th style="padding: 12px 16px; text-align: right; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; font-weight: 600; border-bottom: 1px solid #e9ecef;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dept, stat : ${departments}" th:if="${departments != null and not departments.isEmpty()}">
                        <td style="padding: 12px 16px; border-bottom: 1px solid #f1f3f5; color: #6c757d;" th:text="${stat.index + 1}"></td>
                        <td style="padding: 12px 16px; border-bottom: 1px solid #f1f3f5; color: #1a1a2e; font-weight: 600;">
                            <span style="display: inline-block; padding: 2px 10px; border-radius: 999px; background: rgba(47, 121, 255, 0.12); color: #2f79ff; font-size: 0.8rem;">
                                <span th:text="${dept.getdept_code()}"></span>
                            </span>
                        </td>
                        <td style="padding: 12px 16px; border-bottom: 1px solid #f1f3f5; color: #1a1a2e;" th:text="${dept.getdept_name()}"></td>
                        <td style="padding: 12px 16px; border-bottom: 1px solid #f1f3f5;">
                            <span style="display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; background: rgba(34, 197, 94, 0.12); color: #22c55e;" 
                                  th:if="${dept.getIs_default()}">✓ Default</span>
                            <span style="display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; background: rgba(108, 117, 125, 0.12); color: #6c757d;" 
                                  th:unless="${dept.getIs_default()}">-</span>
                        </td>
                        <td style="padding: 12px 16px; border-bottom: 1px solid #f1f3f5; text-align: right;">
                            <div style="display: flex; gap: 6px; justify-content: flex-end;">
                                <a th:href="'/dashboard/departments/edit/' + ${dept.id}" style="padding: 4px 10px; font-size: 0.8rem; border-radius: 8px; text-decoration: none; background: rgba(255, 159, 45, 0.1); color: #ff9f2d;">Edit</a>
                                <a th:href="'/dashboard/departments/delete/' + ${dept.id}" style="padding: 4px 10px; font-size: 0.8rem; border-radius: 8px; text-decoration: none; background: rgba(239, 68, 68, 0.1); color: #ef4444;" 
                                   onclick="return confirm('Are you sure you want to delete this department?')">Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- No Departments Message -->
        <div th:if="${departments == null or departments.isEmpty()}" style="text-align: center; padding: 60px 20px; color: #6c757d;">
            <div style="font-size: 4rem; margin-bottom: 16px;">🏢</div>
            <h3 style="color: #1a1a2e; margin-bottom: 8px;">No departments found</h3>
            <p th:text="${searchQuery != null} ? 'No departments match your search criteria.' : 'There are no departments in the system yet.'"></p>
            <a href="/dashboard/departments/CreateDepartment" style="display: inline-block; margin-top: 12px; padding: 10px 24px; background: linear-gradient(135deg, #2f79ff, #ff9f2d); color: white; border-radius: 8px; text-decoration: none; font-weight: 600;">Add your first department</a>
        </div>
    </div>
</body>
</html>
